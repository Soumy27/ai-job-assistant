<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="CareerAI">
  <!--
    CareerAI mark — three rising columns on an ink tile: a job hunt as a
    ledger filling up, the live stage in the one chart hue. Same mark as the
    browser extension (extension/icons/*.png), so tab and toolbar agree.

    Only three bars: anything finer dissolves at the 16px a tab actually
    renders. In a dark tab strip an ink tile would vanish into the chrome, so
    the tile and bars swap at prefers-color-scheme: dark — the hue stays put,
    which is what makes it still read as the same mark.
  -->
  <style>
    .tile { fill: #141414 }
    .bar  { fill: #f8f8f8 }
    .live { fill: #1d5fbf }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f1f1f1 }
      .bar  { fill: #141414 }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7.5" />
  <rect class="bar"  x="5.5"  y="17"   width="5" height="7"    rx="2.5" />
  <rect class="bar"  x="13.5" y="12.5" width="5" height="11.5" rx="2.5" />
  <rect class="live" x="21.5" y="8"    width="5" height="16"   rx="2.5" />
</svg>
